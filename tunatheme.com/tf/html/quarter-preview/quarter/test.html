<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proje Filtreleme ve Sıralama Sistemi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #e74c3c;
            --light: #ecf0f1;
            --dark: #2c3e50;
            --gray: #95a5a6;
            --success: #27ae60;
            --warning: #f39c12;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* Header Styles */
        header {
            background: linear-gradient(to right, var(--primary), var(--dark));
            color: white;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo i {
            font-size: 2.5rem;
            color: var(--secondary);
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .logo span {
            color: var(--secondary);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        nav a:hover, nav a.active {
            background: var(--secondary);
        }

        /* Main Content */
        .main-content {
            display: flex;
            padding: 30px;
            gap: 30px;
        }

        /* Filters Section */
        .filters {
            flex: 0 0 280px;
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            height: fit-content;
            position: sticky;
            top: 30px;
        }

        .filter-section {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid #eee;
        }

        .filter-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .filter-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-title i {
            color: var(--secondary);
        }

        .filter-options {
            list-style: none;
        }

        .filter-options li {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .filter-options input[type="checkbox"] {
            margin-right: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--secondary);
        }

        .filter-options label {
            cursor: pointer;
            display: flex;
            align-items: center;
            width: 100%;
            font-size: 1.05rem;
        }

        .filter-count {
            margin-left: auto;
            background-color: #f0f7ff;
            color: var(--secondary);
            font-size: 0.9rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* Projects Section */
        .projects {
            flex: 1;
        }

        .projects-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .header-left h2 {
            font-size: 1.8rem;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .header-left p {
            color: var(--gray);
        }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .view-options {
            display: flex;
            gap: 12px;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 50px;
        }

        .view-btn {
            background: none;
            border: none;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.2rem;
            color: var(--gray);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .view-btn.active, .view-btn:hover {
            background: var(--secondary);
            color: white;
        }

        .sort-filter {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sort-filter select {
            padding: 12px 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            font-size: 1rem;
            color: var(--dark);
            cursor: pointer;
            min-width: 200px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Projects Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .project-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            transition: all 0.4s ease;
            position: relative;
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .project-image {
            height: 220px;
            overflow: hidden;
            position: relative;
        }

        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .project-card:hover .project-image img {
            transform: scale(1.05);
        }

        .project-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--accent);
            color: white;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 2;
        }

        .quick-view-btn {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            color: var(--dark);
            border: none;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .project-card:hover .quick-view-btn {
            opacity: 1;
        }

        .project-info {
            padding: 20px;
        }

        .project-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--dark);
        }

        .project-location {
            display: flex;
            align-items: center;
            color: var(--gray);
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .project-location i {
            margin-right: 8px;
            color: var(--secondary);
        }

        .project-features {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .feature {
            text-align: center;
            flex: 1;
        }

        .feature-value {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--dark);
        }

        .feature-label {
            font-size: 0.9rem;
            color: var(--gray);
        }

        .project-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .project-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--secondary);
        }

        .project-price span {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--gray);
        }

        .project-status {
            font-size: 0.9rem;
            font-weight: 600;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .status-ongoing {
            background: #e8f4fc;
            color: var(--secondary);
        }

        .status-completed {
            background: #e6f7ee;
            color: var(--success);
        }

        .status-new {
            background: #fef7e6;
            color: var(--warning);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalFade 0.4s ease;
        }

        @keyframes modalFade {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            background: var(--accent);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 40px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 2rem;
            color: var(--dark);
        }

        .modal-location {
            display: flex;
            align-items: center;
            color: var(--secondary);
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .modal-location i {
            margin-right: 10px;
        }

        .modal-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .modal-main-img {
            grid-column: span 2;
            height: 400px;
            border-radius: 12px;
            overflow: hidden;
        }

        .modal-main-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-thumb {
            height: 150px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.3s ease;
        }

        .modal-thumb:hover, .modal-thumb.active {
            opacity: 1;
            transform: scale(1.03);
        }

        .modal-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-details {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .project-description {
            margin-bottom: 25px;
        }

        .project-description h3 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: var(--dark);
        }

        .project-description p {
            line-height: 1.8;
            color: #555;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .feature-item i {
            font-size: 1.3rem;
            color: var(--secondary);
        }

        .feature-text span {
            display: block;
        }

        .feature-name {
            font-size: 0.9rem;
            color: var(--gray);
        }

        .feature-value {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--dark);
        }

        .project-info-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .price-box {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .price-label {
            font-size: 1rem;
            color: var(--gray);
            margin-bottom: 5px;
        }

        .price-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--secondary);
        }

        .price-note {
            font-size: 0.9rem;
            color: var(--gray);
            margin-top: 5px;
        }

        .contact-btn {
            display: block;
            width: 100%;
            background: var(--secondary);
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .contact-btn:hover {
            background: var(--primary);
            transform: translateY(-3px);
        }

        .project-meta {
            margin-top: 20px;
        }

        .meta-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .meta-item:last-child {
            border-bottom: none;
        }

        .meta-label {
            color: var(--gray);
        }

        .meta-value {
            font-weight: 600;
            color: var(--dark);
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .main-content {
                flex-direction: column;
            }

            .filters {
                position: static;
            }

            .projects-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }

            .modal-details {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }

            .projects-header {
                flex-direction: column;
                gap: 20px;
            }

            .controls {
                width: 100%;
                justify-content: space-between;
            }

            .modal-gallery {
                grid-template-columns: 1fr;
            }

            .modal-main-img {
                grid-column: span 1;
                height: 300px;
            }
        }

        @media (max-width: 576px) {
            .features-grid {
                grid-template-columns: 1fr;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .modal-body {
                padding: 20px;
            }
        }

        /* Animation delays for project cards */
        .project-card:nth-child(1) { animation-delay: 0.1s; }
        .project-card:nth-child(2) { animation-delay: 0.2s; }
        .project-card:nth-child(3) { animation-delay: 0.3s; }
        .project-card:nth-child(4) { animation-delay: 0.4s; }
        .project-card:nth-child(5) { animation-delay: 0.5s; }
        .project-card:nth-child(6) { animation-delay: 0.6s; }
        .project-card:nth-child(7) { animation-delay: 0.7s; }
        .project-card:nth-child(8) { animation-delay: 0.8s; }

        /* Badge colors */
        .badge-apartment { background: #3498db; }
        .badge-residence { background: #9b59b6; }
        .badge-villa { background: #e67e22; }
        .badge-office { background: #1abc9c; }

        /* No results */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .no-results i {
            font-size: 3rem;
            color: var(--gray);
            margin-bottom: 20px;
        }

        .no-results h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--dark);
        }

        .no-results p {
            color: var(--gray);
            max-width: 500px;
            margin: 0 auto 20px;
        }

        .reset-filters {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-filters:hover {
            background: var(--primary);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="logo">
            <i class="fas fa-building"></i>
            <div class="logo-text">Estate<span>Pro</span></div>
        </div>
        <nav>
            <ul>
                <li><a href="#">Ana Sayfa</a></li>
                <li><a href="#">Hakkımızda</a></li>
                <li><a href="#" class="active">Projeler</a></li>
                <li><a href="#">İletişim</a></li>
            </ul>
        </nav>
    </header>

    <div class="main-content">
        <aside class="filters">
            <div class="filter-section">
                <h3 class="filter-title"><i class="fas fa-filter"></i> Filtreler</h3>
                <p>Filtreleri kullanarak aradığınız projeyi bulun</p>
            </div>

            <div class="filter-section">
                <h3 class="filter-title"><i class="fas fa-home"></i> Proje Tipi</h3>
                <ul class="filter-options">
                    <li>
                        <label>
                            <input type="checkbox" name="project-type" value="Apartman" data-filter="project-type">
                            <span>Apartman</span>
                            <span class="filter-count">(0)</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox" name="project-type" value="Rezidans" data-filter="project-type">
                            <span>Rezidans</span>
                            <span class="filter-count">(0)</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox" name="project-type" value="Villa" data-filter="project-type">
                            <span>Villa</span>
                            <span class="filter-count">(0)</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox" name="project-type" value="Ofis" data-filter="project-type">
                            <span>Ofis</span>
                            <span class="filter-count">(0)</span>
                        </label>
                    </li>
                </ul>
            </div>

            <div class="filter-section">
                <h3 class="filter-title"><i class="fas fa-hard-hat"></i> Proje Durumu</h3>
                <ul class="filter-options">
                    <li>
                        <label>
                            <input type="checkbox" name="project-status" value="Devam Ediyor" data-filter="project-status">
                            <span>Devam Ediyor</span>
                            <span class="filter-count">(0)</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox" name="project-status" value="Yeni Başladı" data-filter="project-status">
                            <span>Yeni Başladı</span>
                            <span class="filter-count">(0)</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox" name="project-status" value="Tamamlandı" data-filter="project-status">
                            <span>Tamamlandı</span>
                            <span class="filter-count">(0)</span>
                        </label>
                    </li>
                </ul>
            </div>

            <div class="filter-section">
                <h3 class="filter-title"><i class="fas fa-tag"></i> Daire Durumu</h3>
                <ul class="filter-options">
                    <li>
                        <label>
                            <input type="checkbox" name="apartment-status" value="Satılık" data-filter="apartment-status">
                            <span>Satılık</span>
                            <span class="filter-count">(0)</span>
                        </label>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox" name="apartment-status" value="Kiralık" data-filter="apartment-status">
                            <span>Kiralık</span>
                            <span class="filter-count">(0)</span>
                        </label>
                    </li>
                </ul>
            </div>

            <button class="contact-btn" id="reset-filters">
                <i class="fas fa-sync-alt"></i> Filtreleri Sıfırla
            </button>
        </aside>

        <main class="projects">
            <div class="projects-header">
                <div class="header-left">
                    <h2>Projelerimiz <span id="filtered-count">(0)</span></h2>
                    <p>Filtrelerinize uygun projeler listeleniyor</p>
                </div>
                <div class="controls">
                    <div class="view-options">
                        <button class="view-btn grid-view active" title="Grid Görünümü">
                            <i class="fas fa-th-large"></i>
                        </button>
                        <button class="view-btn list-view" title="Liste Görünümü">
                            <i class="fas fa-list"></i>
                        </button>
                    </div>
                    <div class="sort-filter">
                        <select id="sort-projects">
                            <option value="default">Varsayılan Sıralama</option>
                            <option value="price-low">Fiyat (Düşükten Yükseğe)</option>
                            <option value="price-high">Fiyat (Yüksekten Düşüğe)</option>
                            <option value="newest">En Yeni Projeler</option>
                            <option value="oldest">En Eski Projeler</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="projects-grid" id="projects-container">
                <!-- Projeler buraya JavaScript ile eklenecek -->
            </div>
        </main>
    </div>
</div>

<!-- Quick View Modal -->
<div class="modal" id="quick-view-modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <div class="modal-body" id="modal-body">
            <!-- Modal içeriği buraya JavaScript ile eklenecek -->
        </div>
    </div>
</div>
